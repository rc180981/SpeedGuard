<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F2744"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF5400"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Shield Background -->
  <path d="M 32 4 C 46 8.5 54 12 54 22 C 54 39.5 44 51.5 32 60 C 20 51.5 10 39.5 10 22 C 10 12 18 8.5 32 4 Z" 
        fill="url(#shieldGrad)" 
        stroke="rgba(255,255,255,0.22)" 
        stroke-width="1.2"
        filter="url(#shadow)"/>

  <!-- Inner Border Accent -->
  <path d="M 32 7.5 C 43 11 49.5 14 49.5 22.5 C 49.5 37 41.5 47.5 32 55 C 22.5 47.5 14.5 37 14.5 22.5 C 14.5 14 21 11 32 7.5 Z" 
        fill="none" 
        stroke="#FF6B00" 
        stroke-width="1.2" 
        stroke-dasharray="2.5 1.5"
        opacity="0.65"/>

  <!-- Radar Waves (Scanning pulses) -->
  <path d="M 20 22 A 14 14 0 0 1 44 22" fill="none" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <path d="M 23.5 24.5 A 10 10 0 0 1 40.5 24.5" fill="none" stroke="#FF8A00" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <path d="M 27 27 A 6 6 0 0 1 37 27" fill="none" stroke="url(#orangeGrad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Speedometer Center Dial / Safe Limit Badge -->
  <circle cx="32" cy="38" r="13" fill="#0A192F" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="32" cy="38" r="10.8" fill="#FFFFFF"/>
  <!-- Safety Orange Warning Arc on Rim -->
  <circle cx="32" cy="38" r="10.8" fill="none" stroke="#FF5400" stroke-width="2.2" stroke-dasharray="26 40" stroke-dashoffset="-4"/>

  <!-- Speed Limit "20" -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Roboto, sans-serif" font-size="10.5" font-weight="900" fill="#0F2744" text-anchor="middle" letter-spacing="-0.5">20</text>

  <!-- Speed Pointer Accent -->
  <polygon points="32,32 30.5,38 33.5,38" fill="#FF5400"/>
  <circle cx="32" cy="38" r="1.5" fill="#0F2744"/>
</svg>
